apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-encode-svc
  namespace: default
  labels:
    app: video-encode-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-encode-svc
  template:
    metadata:
      labels:
        app: video-encode-svc
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: "<YOUR_CPU_ENCODE_NODEPOOL>"
      tolerations:
        - operator: Exists
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: video-encode-svc
          image: "<YOUR_ARTIFACT_REGISTRY>/sglang-torchtpu-diffusion:v0.2.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: FFMPEG_THREADS
              value: "16"
          ports:
            - containerPort: 8090
              name: http
          resources:
            requests:
              cpu: "32"
              memory: "64Gi"
            limits:
              cpu: "44"
              memory: "96Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          command:
            - python3
            - -u
            - /workspace/scripts/video_encode_server.py
---
apiVersion: v1
kind: Service
metadata:
  name: video-encode-svc
  namespace: default
  labels:
    app: video-encode-svc
spec:
  type: ClusterIP
  selector:
    app: video-encode-svc
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
